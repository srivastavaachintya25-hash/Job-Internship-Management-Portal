
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Career Portal</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../navbar.css">
    
</head>
<body>
<header class="navbar">

    <a href="../Home/home.html" class="logo">
        Career<span>Portal</span>
    </a>

    <nav class="nav-links">
        <a href="../Home/home.html">Home</a>
        <a href="../Job/jobs.html">Jobs</a>
        <a href="../Internships%20Page/Internships.html">Internships</a>
        <a href="../Application%20and%20profile/profile.html">Profile</a>
        <a href="../Application%20and%20profile/user-list.html">Application Records</a>
        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
    </nav>

</header>

</header>

<section class="login-section">
    <div class="login-container">

        <div class="login-heading">
            <h1>Welcome Back!</h1>
            <p>Login to access your Career Portal account.</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>
            </div>

           <div class="login-options">
    <label class="remember-option">
        <input type="checkbox" id="rememberMe">
        <span>Remember me</span>
    </label>

    <a href="forgot-password.html" class="forgot-link">
        Forgot Password?
    </a>
</div>
            <button type="submit" class="login-btn">Login</button>
            <p id="message"></p>

        </form>

        <p class="register-text">
    Don't have an account?
    <a href="register.html" class="register-link">Create Account</a>
</p>

    </div>
</section>

<footer>
    <p>© 2026 Career Portal. All Rights Reserved.</p>
</footer>

<script src="login.js"></script>
<script src="../auth.js"></script>
</body>
</html>
