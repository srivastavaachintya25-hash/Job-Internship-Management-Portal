
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Career Portal</title>

    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="../navbar.css">
</head>
<body>
<header class="navbar">

    <a href="../Home/home.html" class="logo">
        Career<span>Portal</span>
    </a>

    <nav class="nav-links">
        <a href="../Home/home.html">Home</a>
        <a href="../Job/jobs.html">Jobs</a>
        <a href="../Internships%20Page/Internships.html">Internships</a>
        <a href="../Application%20and%20profile/profile.html">Profile</a>
        <a href="../Application%20and%20profile/user-list.html">Application Records</a>
    </nav>

</header>

<div class="register-container">
    <div class="register-box">

        <h1>Create Account</h1>
        <p class="subtitle">
            Join Career Portal and explore opportunities.
        </p>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Create a password"
                   required minlength="6">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password" required>

            <button type="submit">Create Account</button>

            <p id="message"></p>

        </form>

        <p class="login-text">
    Already have an account?
    <a href="login.html" class="login-link">Login Here</a>
</p>

    </div>
</div>
<footer>
    <p>© 2026 Career Portal. All Rights Reserved.</p>
</footer>
<script src="register.js"></script>
<script src="../auth.js"></script>
</body>
</html>
