
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Career Portal</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="../navbar.css">
    <script src="../auth.js" defer></script>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="../Home/home.html" class="logo">
            Career<span>Portal</span>
        </a>

        <nav class="nav-links">
            <a href="../Home/home.html">Home</a>
            <a href="../Job/jobs.html">Jobs</a>
            <a href="../Internships%20Page/Internships.html">Internships</a>
            <a href="../Application%20and%20profile/profile.html">Profile</a>
            <a href="../Application%20and%20profile/user-list.html">
                Application Records
            </a>
        </nav>

        <div class="nav-auth" id="navAuth"
             data-login-url="login.html"></div>

    </header>

    <!-- FORGOT PASSWORD -->
    <main class="forgot-container">

        <div class="forgot-card">

            <div class="forgot-icon">?</div>

            <h2>Forgot Password?</h2>

            <p class="forgot-description">
                Don't worry! Enter your registered email address
                and we'll help you reset your password.
            </p>

            <form id="forgotForm">

                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>

                    <input type="email"
                           id="forgotEmail"
                           placeholder="Enter your registered email"
                           required>
                </div>

                <button type="submit" class="reset-button">
                    Send Reset Link
                </button>

                <p id="forgotMessage"></p>

            </form>

            <p class="back-login">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Career Portal. All Rights Reserved.</p>
    </footer>

    <script src="forgot-password.js"></script>

</body>
</html>
