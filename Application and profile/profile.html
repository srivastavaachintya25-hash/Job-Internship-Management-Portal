
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Career Portal</title>

    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="../navbar.css">
    <script src="../auth.js" defer></script>
</head>
<body>


<header class="navbar">

    <a href="../Home/home.html" class="logo">
        Career<span>Portal</span>
    </a>

    <nav class="nav-links">
        <a href="../Home/home.html">Home</a>
        <a href="../Job/jobs.html">Jobs</a>
        <a href="../Internships Page/Internships.html">Internships</a>
        <a href="../Application and profile/profile.html" class="active">Profile</a>
        <a href="../Application and profile/user-list.html">Application Records</a>
    </nav>

<div class="nav-auth" id="navAuth" data-login-url="../Login/login.html">
    <button type="button" class="login-button"
        onclick="window.location.href='../Login/login.html'">
        Login
    </button>
</div>

</header>


<main class="profile-container">

    <section class="profile-header">
        <div class="profile-image">AS</div>

        <div>
            <h1>Your Profile</h1>
            <p>Manage your personal and professional information.</p>
        </div>

        <button type="button" class="edit-button">Edit Profile</button>
    </section>

    <section class="profile-card">
        <h2>Personal Information</h2>

        <div class="form-grid">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" placeholder="Enter your location">
            </div>
        </div>
    </section>

    <section class="profile-card">
        <h2>Professional Information</h2>

        <div class="form-grid">
            <div class="form-group">
                <label>Education</label>
                <input type="text" placeholder="Enter your education">
            </div>

            <div class="form-group">
                <label>Experience</label>
                <select>
                    <option>Select Experience</option>
                    <option>Fresher</option>
                    <option>Less than 1 Year</option>
                    <option>1–2 Years</option>
                    <option>2+ Years</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Skills</label>
                <input type="text"
                       placeholder="HTML, CSS, JavaScript, Python">
            </div>

            <div class="form-group full-width">
                <label>About You</label>
                <textarea placeholder="Write something about yourself"></textarea>
            </div>
        </div>

        <button type="button" class="save-button">Save Profile</button>
    </section>

</main>

<footer>
    <p>© 2026 Job & Internship Management Portal. All Rights Reserved.</p>
</footer>

<script src="profile.js"></script>
</body>
</html>
