
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal | Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

<header class="navbar">
    <div class="container nav-container">
        <div class="logo">
            <a href="../Home/home.html">Career<span>Portal</span></a>
        </div>

        <nav class="nav-links">
            <a href="../Home/home.html">Home</a>
            <a href="../Job/jobs.html">Jobs</a>
            <a href="../Internships Page/Internships.html">Internships</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="user-list.html">Application Records</a>
        </nav>

        <a href="../Login/login.html" class="login-btn">Login</a>
    </div>
</header>

<main class="profile-container">

    <section class="profile-header">
        <div class="profile-image">AS</div>

        <div>
            <h1>Your Profile</h1>
            <p>Manage your personal and professional information.</p>
        </div>

        <button type="button" class="edit-button">
            Edit Profile
        </button>
    </section>

    <section class="profile-card">
        <h2>Personal Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number">
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" placeholder="Enter your location">
            </div>

        </div>
    </section>

    <section class="profile-card">
        <h2>Professional Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Education</label>
                <input type="text" placeholder="Enter your education">
            </div>

            <div class="form-group">
                <label>Experience</label>
                <select>
                    <option>Select Experience</option>
                    <option>Fresher</option>
                    <option>Less than 1 Year</option>
                    <option>1–2 Years</option>
                    <option>2+ Years</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Skills</label>
                <input type="text"
                    placeholder="HTML, CSS, JavaScript, Python">
            </div>

            <div class="form-group full-width">
                <label>About You</label>
                <textarea placeholder="Write something about yourself"></textarea>
            </div>

        </div>

        <button type="button" class="save-button">
            Save Profile
        </button>

    </section>

</main>

<footer>
    <p>© 2026 Job & Internship Management Portal. All Rights Reserved.</p>
</footer>

</body>
<script src="profile.js"></script>
</html>
