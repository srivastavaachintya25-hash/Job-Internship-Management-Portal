
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Records | Job Portal</title>

    <link rel="stylesheet" href="user-list.css">
    <link rel="stylesheet" href="../navbar.css">
    <script src="../auth.js" defer></script>
</head>
<body>


<header class="navbar">

    <a href="../Home/home.html" class="logo">
        Career<span>Portal</span>
    </a>

    <nav class="nav-links">
        <a href="../Home/home.html" >Home</a>
        <a href="../Job/jobs.html">Jobs</a>
        <a href="../Internships Page/Internships.html">Internships</a>
        <a href="../Application and profile/profile.html">Profile</a>
        <a href="../Application and profile/user-list.html" class="active">Application Records</a>
    </nav>

<div class="nav-auth" id="navAuth" data-login-url="../Login/login.html">
    <button type="button" class="login-button"
        onclick="window.location.href='../Login/login.html'">
        Login
    </button>
</div>
</header>

<main class="container records-main">

    <h1>Application Records</h1>

    <p class="records-intro">
        View and manage submitted applications.
    </p>

    <div class="controls">
        <input type="text" id="searchInput"
               placeholder="Search by name, email or position">

        <select id="statusFilter">
            <option value="all">All Statuses</option>
            <option value="Applied">Applied</option>
            <option value="Under Review">Under Review</option>
            <option value="Shortlisted">Shortlisted</option>
            <option value="Interview">Interview</option>
            <option value="Final Result">Final Result</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Position</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Update Status</th>
                </tr>
            </thead>

            <tbody id="userTable"></tbody>
        </table>
    </div>

    <p id="emptyMessage"></p>

</main>

<footer>
    <p>© 2026 Job & Internship Management Portal. All Rights Reserved.</p>
</footer>

<script src="user-list.js"></script>
</body>
</html>
